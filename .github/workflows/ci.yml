# ci.yml — vela-apps CI 호출 파일 (레포 작업자 관리 영역)
#
# 이 파일은 트리거와 inputs 만 가진다. 단계 틀은 vela-ci-template.yml(공통 템플릿)이 정한다.
# 실제 수행 항목은 ci/*.sh 스크립트이며, PR 전에 로컬에서 같은 스크립트로 검증한다.
#
# 트리거
#   - pull_request    : riscv-vela/vela-apps 로 들어오는 PR
#   - push            : main(병합 시) 과 ci/** 브랜치(포크에서 템플릿 시험용)
#   - paths-ignore    : 바뀐 파일이 모두 문서·이미지·라이선스이면 실행하지 않는다.
#     근거: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onpushpull_requestpull_request_targetpathspaths-ignore
#
# 단계별 설정
#   - 정적분석 : ci/static-analysis.sh — ci/ 스크립트 shellcheck
#   - 단위시험 : ci/unit-test.sh — runtime/test (cmocka) 호스트 빌드·실행
#   - 교차빌드 : 비활성. RISC-V 툴체인 확보 방식이 정해지지 않았다. ci/cross-build.sh 는 로컬용으로 둔다.
#   - examples/attestation 은 vela-fws 의 fw_jump.bin 이 필요한 레포 간 의존이므로 PR CI 대상이 아니다.

name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/LICENSE'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
  push:
    branches:
      - main
      - 'ci/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/LICENSE'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'

permissions:
  contents: read

# 같은 PR 에 새 커밋이 오면 이전 실행을 취소한다. main push 실행은 취소하지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # 호출형으로 바뀌면 이 줄만 riscv-vela/<중앙레포>/.github/workflows/vela-ci-template.yml@<tag> 로 바꾼다.
    uses: ./.github/workflows/vela-ci-template.yml
    with:
      static-analysis-script: ci/static-analysis.sh
      unit-test-script: ci/unit-test.sh
