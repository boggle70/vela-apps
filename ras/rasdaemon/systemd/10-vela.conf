# SPDX-License-Identifier: GPL-2.0
#
# Drop-in for the rasdaemon unit shipped by upstream (misc/rasdaemon.service.in).
# Installed as /etc/systemd/system/rasdaemon.service.d/10-vela.conf.
#
# Two things upstream's unit does not cover on a Vela guest:
#
#  1. tracefs. rasdaemon locates the tracepoints by scanning /proc/mounts for
#     a tracefs mount, falling back to debugfs + /tracing. With neither
#     mounted it exits immediately with "Can't locate a mounted debugfs".
#     Nothing mounts /sys/kernel/tracing on a minimal guest.
#
#  2. Restart policy. Upstream sets Restart=on-abort, which covers a fatal
#     signal but not a clean non-zero exit. Test procedure TC.10.007 collects
#     unattended for the better part of an hour under a ROS 2 workload; a
#     silent exit at minute 3 would void the whole run.

[Unit]
After=sys-kernel-tracing.mount
StartLimitIntervalSec=60
StartLimitBurst=5

[Service]
ExecStartPre=/bin/sh -c 'mountpoint -q /sys/kernel/tracing || mount -t tracefs nodev /sys/kernel/tracing'
ExecStartPre=-/bin/sh -c 'test -d /sys/kernel/tracing/events/ras || echo "rasdaemon: no ras tracepoint group - this kernel lacks CONFIG_RAS, nothing will be recorded" >&2'

Restart=always
RestartSec=5
